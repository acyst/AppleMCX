name: Build AppleMCX.kext

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    env:
      ENABLE_SSH_DEBUG: ${{ secrets.ENABLE_SSH_DEBUG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          uname -a
          sw_vers
          xcodebuild -version
          echo "SDK: $(xcrun --sdk macosx --show-sdk-path)"

      - name: Run P0/P1 host checks
        run: make check-host

      - name: Build kernel KEXT
        run: |
          make clean || true
          make ARCH=arm64e

      - name: Verify KEXT bundle
        run: |
          test -f AppleMCX.kext/Contents/MacOS/AppleMCX
          test -f AppleMCX.kext/Contents/Info.plist
          file AppleMCX.kext/Contents/MacOS/AppleMCX
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" AppleMCX.kext/Contents/Info.plist

      - name: Build userspace toolchain
        run: |
          make -C usermode/toolchain

      - name: Import signing certificate
        if: env.P12_BASE64 != ''
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain-db
          security create-keychain -p build "$KEYCHAIN" || true
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p build "$KEYCHAIN"
          echo "$P12_BASE64" | base64 -d > /tmp/sign.p12
          security import /tmp/sign.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN"
          rm -f /tmp/sign.p12
          security find-identity -v -p codesigning

      - name: Package userspace toolchain (.pkg)
        run: |
          make pkg

      - name: Sign and package KEXT (.pkg)
        run: |
          IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null | \
              grep -oE '"[^"]+"' | head -1 | tr -d '"' || true)
          if [ -n "$IDENTITY" ]; then
            echo "==> 使用证书签名: $IDENTITY"
            ./Tools/make_kext_pkg.sh "$IDENTITY"
          else
            echo "==> 未找到证书, 使用 ad-hoc 签名"
            ./Tools/make_kext_pkg.sh -
          fi

      - name: Upload pkg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppleMCX-pkgs
          path: dist/*.pkg
          if-no-files-found: error

      - name: Upload KEXT artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleMCX.kext-arm64e
          path: AppleMCX.kext
          if-no-files-found: error

      - name: Start SSH debug session on failure
        if: failure() && env.ENABLE_SSH_DEBUG == 'true'
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access: true
          timeout-minutes: 15
